name: Refresh LeetCode dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r leetcode-dashboard/requirements.txt
      - run: python leetcode-dashboard/scripts/fetch_leetcode_data.py
      - run: python leetcode-dashboard/scripts/process_stats.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leetcode-dashboard/data/leetcode_data.json leetcode-dashboard/data/dashboard.svg
          git diff --cached --quiet || git commit -m "chore: refresh LeetCode stats"
          git push