
name: Update GitHub Analytics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-analytics:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate analytics
        env:
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
        run: |
          if [ -z "$ANALYTICS_TOKEN" ]; then
            echo "ANALYTICS_TOKEN is not configured; private repositories cannot be included."
            exit 1
          fi
          python scripts/github_analytics.py

      - name: Commit updated analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- README.md assets/github-analytics.svg; then
            git add README.md assets/github-analytics.svg
            git commit -m "Update GitHub analytics"
            git push
          else
            echo "No analytics changes to commit."
          fi
